# Build and smoke-test JLib::Scheduler on every supported target.
#
# The point is not the benchmark numbers -- CI runners are shared VMs and their timings are noise.
# The point is that the thing BUILDS and RUNS on each ABI from a CLEAN CHECKOUT. That last part
# matters more than it sounds: the worst bug of the AArch64 port was a stale file that a local
# incremental build happily kept using and a fresh clone could never have produced.
#
# Free on GitHub-hosted runners for public repositories, including the ARM64 Linux ones.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # adds a "Run workflow" button on the Actions tab

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false    # one target failing should not hide the others' results
      matrix:
        include:
          - name: Windows x64 (MSVC)
            os: windows-latest
            bench: build/bin/Release/SchedulerBench.exe
            smoke: build/bin/Release/SchedulerEventSmoke.exe
            topo: build/bin/Release/SchedulerTopologyTest.exe
            prims: build/bin/Release/SchedulerPrimitivesTest.exe
          - name: Linux x86-64 (GCC)
            os: ubuntu-latest
            bench: build/bin/SchedulerBench
            smoke: build/bin/SchedulerEventSmoke
            topo: build/bin/SchedulerTopologyTest
            prims: build/bin/SchedulerPrimitivesTest
          - name: Linux AArch64 (GCC)
            os: ubuntu-24.04-arm
            bench: build/bin/SchedulerBench
            smoke: build/bin/SchedulerEventSmoke
            topo: build/bin/SchedulerTopologyTest
            prims: build/bin/SchedulerPrimitivesTest
          - name: macOS arm64 (AppleClang)
            os: macos-14
            bench: build/bin/SchedulerBench
            smoke: build/bin/SchedulerEventSmoke
            topo: build/bin/SchedulerTopologyTest
            prims: build/bin/SchedulerPrimitivesTest

    steps:
      - uses: actions/checkout@v4

      - name: Report the target
        run: cmake --version
        shell: bash

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        shell: bash

      # --config matters on Windows (the VS generator is multi-config and ignores
      # CMAKE_BUILD_TYPE); it is harmlessly ignored by single-config generators.
      - name: Build
        run: cmake --build build --config Release -j 2
        shell: bash

      # AffinityPolicy::None, not the default Hard: CI containers run under a restricted cpuset, so
      # pinning to a CPU index the cgroup does not own just fails. The scheduler ignores that
      # failure by design, but None keeps the run honest about what is being tested -- correctness,
      # not placement.
      - name: Run benchmark (smoke test)
        run: ./${{ matrix.bench }} none
        shell: bash

      # The named-event path: a lock-free waiter stack the benchmark never touches. Worth running on
      # every target rather than just one, because the thing at risk in new atomic code is memory
      # ORDERING, and x86 is TSO -- it hands you acquire/release semantics on ordinary loads and
      # stores whether you asked for them or not. A missing barrier is invisible there. Two of these
      # four runners are weakly ordered ARM64, which is the only reason this test is worth much.
      - name: Run event test (lock-free waiter stack)
        run: ./${{ matrix.smoke }}
        shell: bash

      # The >64-CPU path, which none of these runners is wide enough to exercise for real. These are
      # the parts of it that are pure logic: mask math, the flat CpuId split, the sysfs list parser,
      # and a hand-built uneven-processor-group topology checking that every worker gets a CPU that
      # actually exists. It carries a negative control asserting the old dense scheme WOULD have
      # failed that case, so a pass means something rather than just "this runner is dense".
      - name: Run topology test (wide-CPU logic)
        run: ./${{ matrix.topo }}
        shell: bash

      # The fiber-aware locks: mutex, semaphore, condition variable, ScopedPermit. Carries the
      # regression test for the 1.2.3 self-deadlock, which is verified to FAIL with the guard removed
      # rather than merely passing with it present. Every blocking case runs under a watchdog, so a
      # regression exits nonzero in 30 seconds instead of hanging this job for its full timeout --
      # which is exactly what the 1.2.0 macOS bug did, for thirty minutes a run.
      - name: Run primitives test (locks, and the deadlock regression)
        run: ./${{ matrix.prims }}
        shell: bash

      # Same suite again under IdlePolicy::NoSleep. That policy changes the worker's park path --
      # the exact code the 1.2.0 lost wakeup lived in -- so running the existing blocking cases
      # under it is worth far more than a bespoke test would be. Cheap: the suite is seconds, and
      # it carries its own watchdog, so a regression here fails fast instead of hanging the job.
      - name: Run primitives test under NoSleep
        run: ./${{ matrix.prims }} nosleep
        shell: bash

      # macOS arm64 ONLY, and a deliberate reproducer rather than a test.
      #
      # The fiber-contention case at 2000 iterations (~4000 contended fiber suspend/resume round
      # trips) blew the 30s watchdog here on 2026-08-16 -- but the SAME test at the SAME count had
      # passed one commit earlier, so the failure is INTERMITTENT. Lowering the default to 200 may
      # therefore have cut the odds of hitting a race by ~10x rather than fixing anything, and this
      # project has already shipped exactly this shape once: the 1.2.0 sleep-predicate lost wakeup
      # hung macOS arm64 about one run in three and never reproduced on x86, because TSO hides it.
      #
      # Ten runs at the high count with a RAISED watchdog is what separates the two explanations:
      #   all ten complete (even if slowly) -> suspend/resume here is just slow; nothing to fix
      #   any run hangs to the 120s watchdog -> a race, and the iteration count is irrelevant
      # continue-on-error: this is diagnostic, so a hit must not turn main red until it is
      # understood -- read the step's log, do not trust the job's colour for this one.
      - name: macOS arm64 race hunt (high-iteration reproducer, diagnostic)
        if: matrix.os == 'macos-14'
        continue-on-error: true
        env:
          JLIB_TEST_CONTENTION_ITERS: 2000
          JLIB_TEST_WATCHDOG_SECS: 120
        run: |
          for i in $(seq 1 10); do
            echo "=== run $i ==="
            ./${{ matrix.prims }} || echo "RUN $i FAILED (exit $?)"
          done
        shell: bash

      # The steal counters compile out entirely in a normal build, which is the point but also the
      # hazard: code that is never compiled rots silently, and the first person to need it would
      # discover that months later while chasing something else. This is the one place it gets built,
      # so a typo in it cannot reach a release unnoticed. One target is enough, since the code is
      # platform-independent, and it goes on the cheapest runner.
      - name: Build with steal instrumentation (one target)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -S . -B build-stats -DCMAKE_BUILD_TYPE=Release -DJLIBSCHED_STEAL_STATS=ON
          cmake --build build-stats -j 2
          ./build-stats/bin/SchedulerBench none 4 nosweep
        shell: bash

  # ---------------------------------------------------------------------------------------------
  # Windows on ARM64 -- BRING-UP, ALLOWED TO FAIL.
  #
  # continue-on-error on the WHOLE JOB, deliberately: src/win32/aarch64/ContextSwitch.asm is a
  # hand-written switch for an ABI nobody here has hardware for, and it must not be able to turn
  # main red while it is being brought up. Flip this to a required leg (and fold it into the build
  # matrix) only once it has passed consistently -- at which point Windows/ARM64 can be called
  # supported, and NOT before.
  #
  # THE TEST THAT MATTERS IS THE PRIMITIVES SUITE, not the build. A context switch that is wrong
  # about the callee-saved set, or that clobbers x18 (the TEB pointer -- and fibers MIGRATE between
  # worker threads here, so a stale TEB lands on an innocent thread), compiles and links perfectly
  # and then corrupts thread-local state nondeterministically. The primitives suite is thousands of
  # real fiber suspend/resume round trips under contention, which is what actually exercises that.
  # A green build here proves almost nothing on its own.
  #
  # NOT covered yet: tests/fibertest_aarch64.cpp, the isolated ABI harness, is POSIX-only (mmap, and
  # a fork-based guard-page check). A Windows port of it would localise failures to the assembly
  # instead of inferring them from a scheduler crash, and is the obvious follow-up.
  windows-arm64-bringup:
    name: Windows ARM64 (MSVC) -- bring-up, allowed to fail
    runs-on: windows-11-arm
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Report the target
        run: |
          cmake --version
          echo "PROCESSOR_ARCHITECTURE=$PROCESSOR_ARCHITECTURE"
        shell: bash

      # Expect "Windows / aarch64 (os layer: win32)". If it says x86_64, the arch detection in
      # CMakeLists.txt did not fire and everything below is testing the wrong switch.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Build
        run: cmake --build build --config Release -j 2
        shell: bash

      # Ordered cheapest-signal-first. The event smoke test is the shortest thing that drives real
      # fibers, so a switch that cannot complete one round trip dies here with a clear symptom
      # rather than as a hang thirty seconds into the primitives suite.
      - name: Run event test (lock-free waiter stack)
        run: ./build/bin/Release/SchedulerEventSmoke.exe
        shell: bash

      # Not fiber-related, but it is the one test that reads the Windows topology API, and the
      # ARM64 machines are big.LITTLE -- so P/E classification is genuinely untested territory here.
      - name: Run topology test (wide-CPU logic)
        run: ./build/bin/Release/SchedulerTopologyTest.exe
        shell: bash

      - name: Run primitives test (the real check -- fiber suspend/resume under contention)
        run: ./build/bin/Release/SchedulerPrimitivesTest.exe
        shell: bash

      - name: Run primitives test under NoSleep
        run: ./build/bin/Release/SchedulerPrimitivesTest.exe nosleep
        shell: bash

      - name: Run benchmark (smoke test)
        run: ./build/bin/Release/SchedulerBench.exe none
        shell: bash

  # The ABI harness: links against ONE object (the context switch) with no scheduler attached, so a
  # failure here is unambiguously the assembly's fault. Run at BOTH -O0 and -O2 -- register
  # allocation around the pinned callee-saved sentinels differs enough between them that a broken
  # switch can pass at one level and fail at the other.
  # Runs on BOTH AArch64 OSes, because the ABI is shared but the toolchain and object format are
  # not: Linux is GCC/ELF, macOS is AppleClang/Mach-O and takes the #if defined(__APPLE__) half of
  # the file -- the half that can only ever be exercised on a Mac. `c++` resolves correctly on each.
  # Note `uname -m` disagrees between them: Linux says aarch64, Darwin says arm64. Same ISA.
  context-switch-abi:
    name: ABI harness -- ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AArch64 (GCC/ELF)
            os: ubuntu-24.04-arm
          - name: macOS arm64 (AppleClang/Mach-O)
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      # Block scalar, not an inline one: an unquoted YAML value containing ": " parses as a nested
      # mapping and breaks the whole file.
      - name: Verify we are actually on AArch64
        run: |
          uname -m | grep -Eq '^(aarch64|arm64)$'
          echo "arch is $(uname -m)"
      - name: Build and run at -O0 and -O2
        run: |
          for O in 0 2; do
            echo "===== -O$O ====="
            c++ -std=c++17 -O$O -g -o ft$O \
              tests/fibertest_aarch64.cpp src/posix/aarch64/ContextSwitch.S
            ./ft$O
          done

# macOS note: macos-14 and later are Apple Silicon; macos-13 is Intel. If an Intel macOS target is
# ever wanted, it needs no new code -- src/darwin/ is the OS layer and src/posix/x86_64/ already has
# the System V switch -- but hw.logicalcpu != hw.physicalcpu there (hyper-threading), and
# src/darwin/Topology.cpp deliberately reports no SMT pairing in that case rather than guess it.
