\* Checked-in TLC config, so both CI and a local `java -cp tla2tools.jar tlc2.TLC fiberresume_model`
\* reproduce the exact bounds already verified by hand (see the .tla file's own header): 828 distinct
\* states at these constants, StateInvariant and ProgressInvariant both hold. ProgressInvariant is a
\* PROPERTY, not an INVARIANT -- it uses ~>, a temporal operator, and TLC rejects it with "not a
\* state predicate" if it lands under INVARIANT instead. Costs the whole exercise once already.

CONSTANTS
    MaxFibers = 3
    MaxWorkers = 2
    MaxWakers = 2

SPECIFICATION Spec

INVARIANT StateInvariant

PROPERTY ProgressInvariant
